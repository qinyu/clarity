stages:
  define:
    - skill: define-lite
      when: 上游材料或已有需求需整理、补全为可评审入池的 Feature 级产品 Spec 时
      inputs: [原始需求材料、来源依据或已有 Spec]
      outputs: [Feature 级 Markdown 产品 Spec（含用户故事、主成功路径、关键实例表）、来源依据及未决待确认项]
  design:
    - skill: design-lite
      when: 已入池需求需形成可审查技术方案与开工清单时
      inputs: [已确认需求、验收依据与目标代码]
      outputs: [技术方案与可执行任务清单及同版审查与决定材料]
  develop:
    - skill: develop-lite
      when: 已批技术方案与任务需在特性分支上实施时
      inputs: [已批技术方案、任务与 DoD]
      outputs: [执行清单、已检视且检查通过的待提交版本及同版验证与检视结果]
    - skill: commit
      when: 任务检视与必需检查通过后，仅在本地分支提交已检视改动时
      inputs: [待提交工作区改动、项目提交消息约定、本项 DoD]
      outputs: [可独立回滚的本地提交及同版提交号]
      permissions: [local-git-commit]
  deliver:
    - skill: deliver-lite
      when: 已提交版本需演示验收并逐仓发起 MR 时
      inputs: [已提交版本、验收清单与验证结果]
      outputs: [演示材料、同版验收依据与逐仓 MR 回执]
